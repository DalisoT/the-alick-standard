# THE ALICK STANDARD — Nixpacks build config for Railway.app
# Pins Node 20 LTS, installs dev deps (needed for `next build` + tsx for db:seed).

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
